# 适配任意可T+0交易的标的（ETF等）
# 具体持仓参数通过 .env 配置

name: position_scalp
display_name: 持仓波段做T
description: 底仓+做T资金双层管理，日内时间窗策略，技术指标辅助决策。适用于ETF等T+0品种。
category: trend
core_rules: [1, 2, 3, 6]
aliases: [做T, 日内短线, 波段, scalp]

instructions: |
  **持仓波段做T策略**

  本策略适用于已有底仓的T+0品种（ETF等），在趋势持仓基础上利用日内波动增厚收益。

  ────────────────────────────────────────

  **时间窗规则（北京时间）：**

  - 09:30–10:00 → 观察期，只看不动。收集开盘方向、成交量、振幅
  - 10:00–11:30 → 上午操作窗口
  - 11:30–13:00 → 休市
  - 13:00–14:30 → 下午操作窗口。下午波动通常小于上午
  - 14:50 → 强制仓位检查。底仓必须恢复，多退少补

  ────────────────────────────────────────

  **做T决策优先级：**

  1. 日内振幅 < 阈值（默认1.5%）→ 不做T
  2. 高开冲高 2%+ → 反T（先卖后买）
  3. 低开 2%+ 急跌企稳 → 正T（先买后卖）
  4. 单边暴涨（日涨幅5%+）→ 不操作，只上调止盈线
  5. 单边暴跌 → 不补仓，观察止损线
  6. 做T单日亏损达阈值（默认2%）→ 停止当天操作

  ────────────────────────────────────────

  **技术信号阈值：**

  - RSI(14) > 85 → 极度超买，优先反T
  - RSI(14) < 25 → 极度超卖，观望等反弹
  - 价格偏离10MA > 15% → 回调预警
  - 放量滞涨 → 减仓信号
  - 缩量下跌 → 不必恐慌

  ────────────────────────────────────────

  **底仓退出规则：**

  - 收盘价 < 止盈线 → 减仓 30%
  - 收盘价 < 止损线 → 减仓 50%
  - 收盘价 < 清仓线 → 清仓
  - 止盈线随最高收盘价上移

  ────────────────────────────────────────

  **分析输出格式：**

  1. 📊 当前状态：现价/涨跌幅/振幅/成交量
  2. 💼 仓位快照：浮盈%/做T资金/止盈止损线
  3. 🔍 技术面：RSI/MA乖离/时间窗
  4. 🎯 操作建议：方向+价位+仓位
  5. ⚠️ 风控提醒
