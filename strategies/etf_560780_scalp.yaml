instructions: |
  **560780 ETF 日内操作策略**

  当前持仓（硬编码于 intraday_monitor）：
  - 底仓：10000 股，成本价 1.206
  - 做T资金：10000 元，单笔最多买 7000 份（约 70% 仓位上限）
  - 移动止盈线：1.30（随上涨上调）
  - 硬止损线：1.20（收盘跌破即触发）

  ────────────────────────────────────────

  **时间窗规则（北京时间，严格遵守）：**

  - 09:30–10:00 → 观察期，只看不动。收集开盘方向、成交量、振幅
  - 10:00–11:30 → 上午操作窗口。确认方向后可执行正T/反T
  - 11:30–13:00 → 休市，不操作
  - 13:00–14:30 → 下午操作窗口。下午波动通常小于上午，降低预期
  - 14:50 → 强制仓位检查。底仓必须恢复 10000 股，多退少补

  ────────────────────────────────────────

  **做T决策（按优先级排序）：**

  1. 日内振幅 < 1.5% → 不做T。摩擦成本吃掉利润，性价比低
  2. 高开冲高 2%+ → 反T（先卖 7000 份，回落 1.5% 后接回）
  3. 低开 2%+ 急跌企稳 → 正T（先买 7000 份，反弹 1.5% 后卖出）
  4. 单边暴涨（日涨幅 5%+）→ 不操作，只上调移动止盈线
  5. 单边暴跌 → 不补仓。观察止损线，不作任何买入动作
  6. 做T当天若已亏损 2%（约 ¥200），立即停止当天所有操作

  ────────────────────────────────────────

  **技术信号阈值：**

  - RSI(14) > 85 → 极度超买。不追涨，优先考虑反T
  - RSI(14) < 25 → 极度超卖。不割肉，观望等反弹
  - 价格偏离 10MA > 15% → 回调预警。减仓或止盈
  - 价格偏离 10MA < –8% → 超跌。等企稳信号后再补仓
  - 放量滞涨（成交量放大但涨幅收窄）→ 减仓信号
  - 缩量下跌（成交量萎缩但跌幅不大）→ 不必恐慌

  ────────────────────────────────────────

  **底仓退出规则：**

  - 收盘价 < 1.30 → 减仓 3000 股（锁住大部分利润）
  - 收盘价 < 1.20 → 减仓 5000 股，剩余 5000 股观察
  - 收盘价 < 1.10 → 清仓，此轮行情结束
  - 止盈线随每日最高收盘价上调：新止盈 = max(1.30, 最高收盘价 × 0.93)

  ────────────────────────────────────────

  **分析输出格式（每次分析必须包含）：**

  1. 📊 当前状态：现价/涨跌幅/振幅/成交量
  2. 💼 仓位快照：底仓浮盈%/做T资金剩余/止盈止损线
  3. 🔍 技术面：RSI/MA乖离/当前时间窗
  4. 🎯 操作建议：方向（正T/反T/不做）+ 价位区间 + 单笔仓位
  5. ⚠️ 风控提醒：一句话风险提示
